<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nbsi-ocean" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#04BBFF" />
      <stop offset="100%" stop-color="#0594D0" />
    </linearGradient>
    <clipPath id="nbsi-disc">
      <circle cx="32" cy="32" r="31" />
    </clipPath>
  </defs>

  <!-- Ocean disc -->
  <circle cx="32" cy="32" r="31" fill="url(#nbsi-ocean)" />

  <!-- Sun -->
  <circle cx="19" cy="17" r="6" fill="#FFEA2C" clip-path="url(#nbsi-disc)" />

  <!-- Waves -->
  <g clip-path="url(#nbsi-disc)">
    <path d="M-4 44 C 9 36, 21 36, 32 44 C 43 52, 55 52, 68 44 V 70 H -4 Z" fill="#0594D0" opacity="0.55" />
    <path d="M-4 51 C 9 43, 21 43, 32 51 C 43 59, 55 59, 68 51 V 70 H -4 Z" fill="#003C57" opacity="0.45" />
  </g>

  <!-- Turtle -->
  <g>
    <ellipse cx="23" cy="32" rx="3.8" ry="2.4" transform="rotate(-22 23 32)" fill="#FFFFFF" />
    <ellipse cx="41" cy="32" rx="3.8" ry="2.4" transform="rotate(22 41 32)" fill="#FFFFFF" />
    <ellipse cx="24.5" cy="43.5" rx="3.4" ry="2.2" transform="rotate(24 24.5 43.5)" fill="#FFFFFF" />
    <ellipse cx="39.5" cy="43.5" rx="3.4" ry="2.2" transform="rotate(-24 39.5 43.5)" fill="#FFFFFF" />
    <ellipse cx="32" cy="25.5" rx="4" ry="3.6" fill="#FFFFFF" />
    <ellipse cx="32" cy="36.5" rx="10.5" ry="8" fill="#FFFFFF" stroke="#0594D0" stroke-width="0.9" />
    <circle cx="30.4" cy="24.4" r="0.85" fill="#0594D0" />
  </g>

  <!-- Outer ring -->
  <circle cx="32" cy="32" r="30.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5" />
</svg>
